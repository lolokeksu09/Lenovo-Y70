name: PDD Overlay RU beta3 emulator UI smoke
on:
  push:
    branches:
      - pdd-overlay-ru-compose-single-v020
    paths:
      - '.github/workflows/pdd-compose-emulator-smoke.yml'
      - 'pdd-overlay-ru/source_bundle.base64'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore Android project
        run: |
          base64 -d pdd-overlay-ru/source_bundle.base64 > /tmp/pdd-compose-src.zip
          unzip -q /tmp/pdd-compose-src.zip
          grep -q 'versionCode 13' pinduoduo_overlay_ru/app/build.gradle
          grep -q "versionName '0.2.0-beta.3'" pinduoduo_overlay_ru/app/build.gradle
          test -f pinduoduo_overlay_ru/app/src/main/java/app/pinduoduo/overlayru/TranslationQueueGate.kt
          test -f pinduoduo_overlay_ru/app/src/main/java/app/pinduoduo/overlayru/PaymentActionPolicy.kt
      - name: Build debug APK
        run: gradle -p pinduoduo_overlay_ru :app:assembleDebug --no-daemon
      - name: Emulator install, launch and UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p smoke-evidence
            adb install -r pinduoduo_overlay_ru/app/build/outputs/apk/debug/app-debug.apk
            # Do not wait for the fully drawn frame on software-emulated CI devices.
            timeout 30s adb shell am start -n app.pinduoduo.overlayru/.HomeActivity | tee smoke-evidence/launch.txt
            sleep 12
            adb shell pidof app.pinduoduo.overlayru | tee smoke-evidence/pid.txt
            timeout 20s adb logcat -d -t 1500 > smoke-evidence/logcat.txt || true
            timeout 25s adb shell dumpsys activity activities > smoke-evidence/activity.txt || true
            # Screenshots are diagnostic, not a hard gate on CPU-only emulators.
            timeout 25s adb exec-out screencap -p > smoke-evidence/home.png || true
            timeout 30s adb shell am start -n app.pinduoduo.overlayru/.MainActivity | tee smoke-evidence/settings-launch.txt
            sleep 3
            adb shell pidof app.pinduoduo.overlayru
            timeout 30s adb shell am start -n app.pinduoduo.overlayru/.LicenseActivity | tee smoke-evidence/license-launch.txt
            sleep 3
            adb shell pidof app.pinduoduo.overlayru
            timeout 20s adb logcat -d -t 1500 > smoke-evidence/logcat-after.txt || true
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDD-RU-beta3-emulator-smoke
          path: smoke-evidence/
          if-no-files-found: warn
