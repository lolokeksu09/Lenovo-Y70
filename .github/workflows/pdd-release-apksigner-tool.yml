name: PDD Android SDK apksigner export
on:
  push:
    branches: [pdd-overlay-ru-stabilization-beta11]
    paths: ['.github/workflows/pdd-release-apksigner-tool.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy official Android SDK apksigner jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          test -n "$JAR" && test -s "$JAR"
          mkdir -p output
          cp "$JAR" output/apksigner.jar
          sha256sum output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: PDD-android-sdk-apksigner-jar
          path: output/apksigner.jar
          if-no-files-found: error
