name: PDD Overlay RU Kotlin runtime safety v0.2.0-beta.3

on:
  push:
    branches: [pdd-overlay-ru-runtime-hardening-beta3]
    paths:
      - '.github/workflows/pdd-runtime-hardening-beta3.yml'
      - 'pdd-overlay-ru/hardening/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hardening-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PDD_LICENSE_API_BASE_URL: ${{ vars.PDD_LICENSE_API_BASE_URL }}
      PDD_LICENSE_PUBLIC_KEY_B64: ${{ vars.PDD_LICENSE_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Repack canonical sources with safety and backpressure guards
        run: |
          python3 pdd-overlay-ru/hardening/apply_runtime_beta3.py
          base64 -d pdd-overlay-ru/source_bundle.base64 > "$RUNNER_TEMP/pdd-source-beta3.zip"
          unzip -q "$RUNNER_TEMP/pdd-source-beta3.zip"
          test "$(find pinduoduo_overlay_ru/app/src/main/java -type f -name '*.java' | wc -l)" -eq 0
          grep -q 'versionCode 13' pinduoduo_overlay_ru/app/build.gradle
          grep -q "versionName '0.2.0-beta.3'" pinduoduo_overlay_ru/app/build.gradle
          grep -q "applicationId 'app.pinduoduo.overlayru'" pinduoduo_overlay_ru/app/build.gradle
          test -f pinduoduo_overlay_ru/app/src/main/java/app/pinduoduo/overlayru/TranslationQueueGate.kt
          test -f pinduoduo_overlay_ru/app/src/main/java/app/pinduoduo/overlayru/PaymentActionPolicy.kt

      - name: Local translation/accessibility regression invariants
        run: bash pinduoduo_overlay_ru/scripts/test_local.sh

      - name: JVM regression tests and Android debug/release APKs
        run: gradle -p pinduoduo_overlay_ru :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify focused behavior tests and prior security suite were not skipped
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path("pinduoduo_overlay_ru/app/build/test-results/testReleaseUnitTest")
          expected = {
              "LicenseTokenVerifierTest": 7,
              "LicenseSecurityMigrationTest": 5,
              "SettingsKotlinMigrationTest": 4,
              "TranslationPolicyKotlinTest": 3,
              "OverlayPlacementKotlinTest": 2,
              "OverlayCoordinatesKotlinTest": 2,
              "OverlayUpdatePolicyKotlinTest": 1,
              "HomeReadinessTest": 6,
              "TranslationQueueGateTest": 6,
              "PaymentActionPolicyTest": 3,
          }
          total = 0
          for name, count in expected.items():
              matches = list(root.glob("TEST-*" + name + ".xml"))
              assert len(matches) == 1, (name, matches)
              report = ET.parse(matches[0]).getroot()
              assert int(report.get("tests", "-1")) == count, (name, count)
              assert int(report.get("failures", "-1")) == 0, name
              assert int(report.get("errors", "-1")) == 0, name
              total += count
              print(name, count, "PASS")
          assert total == 39, total
          print("PASS: 39 Android/JVM release tests")
          PY

      - name: Commit verified beta3 Kotlin source into feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdd-overlay-ru/source_bundle.base64
          if git diff --cached --quiet; then
            echo "::error::Canonical beta3 source update expected"
            exit 1
          fi
          git commit -m "feat(pdd): beta3 ML Kit queue hardening and payment overlay safeguards"
          git push origin HEAD:pdd-overlay-ru-runtime-hardening-beta3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDD-RU-v0.2.0-beta.3-Kotlin-APK-and-tests
          path: |
            pinduoduo_overlay_ru/app/build/outputs/apk/debug/app-debug.apk
            pinduoduo_overlay_ru/app/build/outputs/apk/release/app-release-unsigned.apk
            pinduoduo_overlay_ru/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: warn
