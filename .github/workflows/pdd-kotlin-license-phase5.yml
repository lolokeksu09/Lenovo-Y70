name: PDD Overlay RU Kotlin licensing phase 5
on:
  push:
    branches: [pdd-overlay-ru-kotlin-licensing-v020]
    paths:
      - '.github/workflows/pdd-kotlin-license-phase5.yml'
      - 'pdd-overlay-ru/migrations/kotlin_license_phase5.py'
      - 'pdd-overlay-ru/migrations/license/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kotlin-licensing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PDD_LICENSE_API_BASE_URL: ${{ vars.PDD_LICENSE_API_BASE_URL }}
      PDD_LICENSE_PUBLIC_KEY_B64: ${{ vars.PDD_LICENSE_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply Kotlin license migration to versioned Android archive
        run: |
          python3 pdd-overlay-ru/migrations/kotlin_license_phase5.py
          base64 -d pdd-overlay-ru/source_bundle.base64 > /tmp/pdd-license-kotlin.zip
          unzip -q /tmp/pdd-license-kotlin.zip
          test "$(find pinduoduo_overlay_ru/app/src/main/java -name '*.java' | wc -l)" -eq 0
          test -f pinduoduo_overlay_ru/app/src/main/java/app/pinduoduo/overlayru/LicenseActivity.kt
          test -f pinduoduo_overlay_ru/app/src/main/java/app/pinduoduo/overlayru/LicenseManager.kt
          test -f pinduoduo_overlay_ru/app/src/main/java/app/pinduoduo/overlayru/LicenseTokenVerifier.kt
          grep -q "versionCode 12" pinduoduo_overlay_ru/app/build.gradle
      - name: Manifest, privacy, source and licensing separation checks
        run: bash pinduoduo_overlay_ru/scripts/test_local.sh
      - name: Verify Kotlin/JVM and legacy Java/JUnit RS256 contract, build APK
        run: gradle -p pinduoduo_overlay_ru :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Assert signature and negative regression tests executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("pinduoduo_overlay_ru/app/build/test-results/testReleaseUnitTest")
          tests = (
              "LicenseTokenVerifierTest",
              "LicenseSecurityMigrationTest",
              "SettingsKotlinMigrationTest",
              "TranslationPolicyKotlinTest",
              "OverlayPlacementKotlinTest",
              "OverlayCoordinatesKotlinTest",
              "OverlayUpdatePolicyKotlinTest",
              "HomeReadinessTest",
          )
          for test in tests:
              reports = list(root.glob("TEST-*" + test + ".xml"))
              assert len(reports) == 1, (test, reports)
              xml = ET.parse(reports[0]).getroot()
              count = int(xml.get("tests", "0"))
              failed = int(xml.get("failures", "0"))
              errors = int(xml.get("errors", "0"))
              assert count > 0 and not failed and not errors, (test, count, failed, errors)
              print(test, count, "PASS")
          PY
      - name: Commit verified canonical Kotlin source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdd-overlay-ru/source_bundle.base64
          if git diff --cached --quiet; then
            echo 'Expected canonical archive update after Kotlin licensing conversion'
            exit 1
          fi
          git commit -m "refactor(pdd): migrate last Java production classes to Kotlin"
          git push origin HEAD:pdd-overlay-ru-kotlin-licensing-v020
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDD-RU-Kotlin-license-phase5-apk-tests
          path: |
            pinduoduo_overlay_ru/app/build/outputs/apk/debug/app-debug.apk
            pinduoduo_overlay_ru/app/build/outputs/apk/release/app-release-unsigned.apk
            pinduoduo_overlay_ru/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: warn
