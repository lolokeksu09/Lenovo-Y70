name: PDD Overlay RU license server tests
on:
  push:
    branches: [pdd-overlay-ru-commerce]
    paths:
      - 'pdd-overlay-ru/commerce/**'
      - '.github/workflows/pdd-license-server-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: pdd-overlay-ru/commerce/license-server
        run: python -m pip install -e '.[test]'
      - name: Test licensing and security invariants
        working-directory: pdd-overlay-ru/commerce/license-server
        run: python -m pytest -q
