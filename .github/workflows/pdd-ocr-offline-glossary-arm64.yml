name: PDD OCR glossary hardening ARM64 release validation
on:
  push:
    branches: [pdd-ocr-offline-glossary-hardening]
    paths:
      - '.github/workflows/pdd-ocr-offline-glossary-arm64.yml'
      - 'pdd-overlay-ru/android/**'
      - 'pdd-overlay-ru/qa/ocr_image_e2e.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PDD_LICENSE_API_BASE_URL: ${{ vars.PDD_LICENSE_API_BASE_URL }}
      PDD_LICENSE_PUBLIC_KEY_B64: ${{ vars.PDD_LICENSE_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preserve app identity and run privacy/security validator
        shell: bash
        run: |
          set -euo pipefail
          python3 pdd-overlay-ru/beta11/bootstrap_android.py
          ln -s pdd-overlay-ru/android pinduoduo_overlay_ru
          grep -q "versionCode 21" pdd-overlay-ru/android/app/build.gradle
          grep -q "versionName '0.2.0-beta.11'" pdd-overlay-ru/android/app/build.gradle
          grep -q "ndk { abiFilters 'arm64-v8a' }" pdd-overlay-ru/android/app/build.gradle
          bash pinduoduo_overlay_ru/scripts/test_local.sh
      - name: Build ARM64 unsigned release and run 76 JVM tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p pdd-overlay-ru/android :app:testReleaseUnitTest :app:assembleRelease --no-daemon
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile
          base = Path("pdd-overlay-ru/android/app")
          reports = list((base/"build/test-results/testReleaseUnitTest").glob("TEST-*.xml"))
          assert reports, "No tests executed"
          count = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for f in reports:
              root = ET.parse(f).getroot()
              for key in count: count[key] += int(root.get(key, "0"))
          assert count == {"tests":76,"failures":0,"errors":0,"skipped":0}, count
          apk=base/"build/outputs/apk/release/app-release-unsigned.apk"
          assert apk.stat().st_size > 1000000
          with zipfile.ZipFile(apk) as z:
              libs=[p for p in z.namelist() if p.startswith("lib/") and p.endswith(".so")]
              assert libs and all(p.startswith("lib/arm64-v8a/") for p in libs), libs
              assert any(p.endswith("/libtranslate_jni.so") for p in libs)
              assert any(p.endswith("/libmlkit_google_ocr_pipeline.so") for p in libs)
          config=list((base/"build/generated/source/buildConfig/release").rglob("BuildConfig.java"))
          assert len(config)==1
          generated=config[0].read_text()
          for field in ("LICENSE_API_BASE_URL", "LICENSE_PUBLIC_KEY_B64"):
              found=[s for s in generated.splitlines() if "String "+field+" =" in s]
              assert len(found)==1 and not found[0].strip().endswith('= "";'), field
          print("PASS: ARM64 76/76 tests, OCR/translate native libraries, PRO build fields configured")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDD-offline-glossary-ARM64-unsigned-INTERNAL
          path: |
            pdd-overlay-ru/android/app/build/outputs/apk/release/app-release-unsigned.apk
            pdd-overlay-ru/android/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: warn
