name: PDD Overlay RU ARM64 OCR photo regions beta7

on:
  push:
    branches: [pdd-overlay-ru-ocr-photo-regions-beta7]
    paths:
      - '.github/workflows/pdd-ocr-photo-regions-beta7.yml'
      - 'pdd-overlay-ru/beta7/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PDD_LICENSE_API_BASE_URL: ${{ vars.PDD_LICENSE_API_BASE_URL }}
      PDD_LICENSE_PUBLIC_KEY_B64: ${{ vars.PDD_LICENSE_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply beta7 archive migration and verify source constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 pdd-overlay-ru/beta7/apply_ocr_regions_beta7.py
          base64 -d pdd-overlay-ru/source_bundle.base64 > "$RUNNER_TEMP/pdd-beta7.zip"
          unzip -tq "$RUNNER_TEMP/pdd-beta7.zip"
          unzip -q "$RUNNER_TEMP/pdd-beta7.zip"
          APP=pinduoduo_overlay_ru
          test "$(find "$APP/app/src/main/java" -name '*.java' | wc -l)" -eq 0
          grep -q 'versionCode 17' "$APP/app/build.gradle"
          grep -q "versionName '0.2.0-beta.7'" "$APP/app/build.gradle"
          grep -q "applicationId 'app.pinduoduo.overlayru'" "$APP/app/build.gradle"
          grep -q "ndk { abiFilters 'arm64-v8a' }" "$APP/app/build.gradle"
          test -f "$APP/app/src/main/java/app/pinduoduo/overlayru/OcrImageViewer.kt"
          test -f "$APP/app/src/test/java/app/pinduoduo/overlayru/OcrRegionTest.kt"

      - name: Existing local Accessibility and translation checks
        run: bash pinduoduo_overlay_ru/scripts/test_local.sh

      - name: Run unit tests and ARM64 release build
        run: gradle -p pinduoduo_overlay_ru :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Assert all 58 JUnit cases ran with no failures/skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder=Path("pinduoduo_overlay_ru/app/build/test-results/testReleaseUnitTest")
          expected={
              "LicenseTokenVerifierTest":7, "LicenseSecurityMigrationTest":5,
              "SettingsKotlinMigrationTest":4, "TranslationPolicyKotlinTest":3,
              "OverlayPlacementKotlinTest":2, "OverlayCoordinatesKotlinTest":2,
              "OverlayUpdatePolicyKotlinTest":1, "HomeReadinessTest":6,
              "TranslationQueueGateTest":6, "PaymentActionPolicyTest":3,
              "CustomGlossaryPolicyTest":4, "OcrTextPolicyTest":4,
              "OcrImagePolicyTest":5, "OcrRegionTest":6
          }
          total=0
          for name,n in expected.items():
              files=list(folder.glob("TEST-*"+name+".xml"))
              assert len(files)==1,(name,files)
              xml=ET.parse(files[0]).getroot()
              for k,expect in [("tests",n),("failures",0),("errors",0),("skipped",0)]:
                  assert int(xml.get(k,-1))==expect, (name,k,xml.get(k))
              total+=n
              print(name,n,"PASS")
          assert total==58,total
          print("PASS:",total,"unit tests")
          PY

      - name: Validate final unsigned APK is ARM64 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          path=Path("pinduoduo_overlay_ru/app/build/outputs/apk/release/app-release-unsigned.apk")
          assert path.is_file() and path.stat().st_size>1000000
          with zipfile.ZipFile(path) as archive:
              names=archive.namelist()
              libs=[n for n in names if n.startswith("lib/") and n.endswith(".so")]
              assert libs
              assert all(n.startswith("lib/arm64-v8a/") for n in libs), libs
              assert any(n.endswith("/libtranslate_jni.so") for n in libs), libs
              assert any(n.endswith("/libmlkit_google_ocr_pipeline.so") for n in libs), libs
              assert "AndroidManifest.xml" in names
          print("PASS: ARM64-only native payload, size:",path.stat().st_size)
          PY

      - name: Commit the exact tested source bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdd-overlay-ru/source_bundle.base64
          if git diff --cached --quiet; then
            echo "::error::No updated beta7 source bundle"
            exit 1
          fi
          git commit -m "feat(pdd): annotate OCR text positions in ARM64 beta7"
          git fetch origin pdd-overlay-ru-ocr-photo-regions-beta7
          git rebase origin/pdd-overlay-ru-ocr-photo-regions-beta7
          git push origin HEAD:pdd-overlay-ru-ocr-photo-regions-beta7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDD-RU-v0.2.0-beta.7-ARM64-OCR-photo-APK-tests
          path: |
            pinduoduo_overlay_ru/app/build/outputs/apk/release/app-release-unsigned.apk
            pinduoduo_overlay_ru/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: warn
