name: Build Lenovo Y70 v2.7 Preview APK

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/build-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Android Studio project
        run: |
          cat source/chunk-0*.b64 | base64 --decode > /tmp/y70-source.tar.xz
          echo "e40936fc0b25316a0661bee5554bf13100aee71d03366df53097f7925643fe24  /tmp/y70-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/y70-source.tar.xz
          test -f app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed preview APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LenovoY70-v2.7-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
