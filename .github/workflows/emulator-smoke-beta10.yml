name: Emulator smoke — signed Legion Control Beta 10
on:
  push:
    branches:
      - 'test/legion-control-beta10-emulator'
    paths:
      - '.github/workflows/emulator-smoke-beta10.yml'
      - 'legion-control-center/tests/emulator_smoke.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  signed-apk-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exactly the signed Beta 10 artifact from release CI
        uses: actions/download-artifact@v4
        with:
          name: Legion-Control-v1.8.0-beta10-Release-Signed
          run-id: 43593196500
          repository: lolokeksu09/Lenovo-Y70
          github-token: ${{ github.token }}
          path: /tmp/legion-apk
      - name: Check APK identity before launching the emulator
        run: |
          set -euo pipefail
          FILE=/tmp/legion-apk/Legion-Control-v1.8.0-beta10-release.apk
          test -s "$FILE"
          echo "743a79ba2f9f10bca14b698e7c0ffa1147b865e7ef404c1c9d790a67b3c27649  $FILE" | sha256sum -c -
      - name: Download official Shizuku v13.6.0 (emulator only)
        run: |
          curl -fsSL --retry 3 --connect-timeout 20 \
            -o /tmp/shizuku-official.apk \
            https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk
          test -s /tmp/shizuku-official.apk
      - name: Enable hardware acceleration on hosted Ubuntu runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Start API 35 emulator and exercise exact signed APK UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_OUTPUT: /tmp/legion-emulator-report
          LEGION_APK: /tmp/legion-apk/Legion-Control-v1.8.0-beta10-release.apk
          SHIZUKU_APK: /tmp/shizuku-official.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash -lc 'python3 legion-control-center/tests/emulator_smoke.py && python3 legion-control-center/tests/emulator_shizuku.py'
      - name: Upload screenshots, UI dump and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legion-beta10-emulator-evidence
          path: /tmp/legion-emulator-report/
          if-no-files-found: warn
          retention-days: 7
