name: PDD Overlay RU beta11 emulator smoke
on:
  push:
    branches: [pdd-overlay-ru-stabilization-beta11]
    paths:
      - '.github/workflows/pdd-beta11-emulator-smoke.yml'
      - 'pdd-overlay-ru/qa/emulator_smoke.sh'
      - 'pdd-overlay-ru/qa/select_bottom_tab.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Resolve canonical source tree
        run: python3 pdd-overlay-ru/beta11/bootstrap_android.py
      - name: Build separate emulator-only x86_64 debug variant
        run: |
          set -euo pipefail
          # The signed/user-facing release remains ARM64 ONLY. This variant
          # exists only for GitHub-hosted x86_64 emulator smoke testing.
          sed -i "s/ndk { abiFilters 'arm64-v8a' }/ndk { abiFilters 'x86_64' }/" pdd-overlay-ru/android/app/build.gradle
          grep -q "ndk { abiFilters 'x86_64' }" pdd-overlay-ru/android/app/build.gradle
          gradle -p pdd-overlay-ru/android :app:assembleDebug --no-daemon
      - name: Grant runner user access to KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::Hardware virtualization device /dev/kvm is not available on this runner"
            exit 1
          fi
          # GitHub runner user is not a member of the kvm group.
          # Without this the Android 35 x86_64 emulator times out booting.
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Launch all four screens in Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          script: bash pdd-overlay-ru/qa/emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDD-beta11-emulator-smoke-evidence
          path: pdd-smoke-evidence/
          if-no-files-found: warn
