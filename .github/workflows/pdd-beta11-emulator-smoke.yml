name: PDD Overlay RU beta11 emulator smoke
on:
  push:
    branches: [pdd-overlay-ru-stabilization-beta11]
    paths:
      - '.github/workflows/pdd-beta11-emulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Resolve canonical source tree
        run: python3 pdd-overlay-ru/beta11/bootstrap_android.py
      - name: Build separate emulator-only x86_64 debug variant
        run: |
          set -euo pipefail
          # The signed/user-facing release remains ARM64 ONLY. This variant
          # exists only for GitHub-hosted x86_64 emulator smoke testing.
          sed -i "s/ndk { abiFilters 'arm64-v8a' }/ndk { abiFilters 'x86_64' }/" pdd-overlay-ru/android/app/build.gradle
          grep -q "ndk { abiFilters 'x86_64' }" pdd-overlay-ru/android/app/build.gradle
          gradle -p pdd-overlay-ru/android :app:assembleDebug --no-daemon
      - name: Launch all four screens in Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p pdd-smoke-evidence
            adb install -r pdd-overlay-ru/android/app/build/outputs/apk/debug/app-debug.apk
            # Only HomeActivity is exported. Navigate to private tabs through
            # their *real* Material3 bottom-bar UI rather than shell am start.
            timeout 40s adb shell am start -W -n app.pinduoduo.overlayru/.HomeActivity > pdd-smoke-evidence/HomeActivity.txt
            sleep 4
            timeout 20s adb shell pidof app.pinduoduo.overlayru > pdd-smoke-evidence/HomeActivity.pid
            timeout 20s adb exec-out screencap -p > pdd-smoke-evidence/HomeActivity.png
            test "$(wc -c < pdd-smoke-evidence/HomeActivity.png)" -gt 4000
            for tab in Фото Словарь Настройки; do
              timeout 35s adb shell uiautomator dump /sdcard/pdd-window.xml > /dev/null
              adb exec-out cat /sdcard/pdd-window.xml > "pdd-smoke-evidence/window-$tab.xml"
              python3 pdd-overlay-ru/qa/select_bottom_tab.py "$tab" "pdd-smoke-evidence/window-$tab.xml" > pdd-smoke-evidence/point.txt
              read x y < pdd-smoke-evidence/point.txt
              adb shell input tap "$x" "$y"
              sleep 4
              timeout 20s adb shell pidof app.pinduoduo.overlayru > "pdd-smoke-evidence/$tab.pid"
              timeout 20s adb exec-out screencap -p > "pdd-smoke-evidence/$tab.png"
              test "$(wc -c < "pdd-smoke-evidence/$tab.png")" -gt 4000
            done
            timeout 25s adb logcat -d -t 5000 > pdd-smoke-evidence/logcat.txt || true
            echo "PASS: all four screens reachable via real bottom tab UI"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDD-beta11-emulator-smoke-evidence
          path: pdd-smoke-evidence/
          if-no-files-found: warn
