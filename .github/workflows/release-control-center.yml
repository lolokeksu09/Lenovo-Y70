name: Build Legion Control v1.8.0-beta5 (stable signing)

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/legion-control-v1.8.0-beta5'
    paths:
      - '.github/workflows/release-control-center.yml'
      - 'legion-control-center/**'

permissions:
  contents: read

concurrency:
  group: legion-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify version and user-service security policy
        shell: bash
        run: |
          set -euo pipefail
          APP=legion-control-center/app/build.gradle
          grep -F "applicationId 'dev.legion.control'" "$APP"
          grep -F 'versionCode 14' "$APP"
          grep -F "versionName '1.8.0-beta5'" "$APP"
          ! grep -q 'applicationIdSuffix' "$APP"
          grep -F 'android:label="Legion Control"' legion-control-center/app/src/main/AndroidManifest.xml
          BASE=legion-control-center/app/src/main/java/dev/legion/control
          TEST=legion-control-center/tests
          mkdir -p "$RUNNER_TEMP/legion-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/legion-tests" \
            "$BASE/CommandPolicy.java" "$BASE/QuickProfile.java" "$BASE/MutationTransaction.java" "$BASE/SystemInspector.java" "$BASE/ActionHistory.java" "$BASE/AccessStatus.java" \
            "$TEST/PolicyTest.java" "$TEST/QuickProfileTest.java" "$TEST/MutationTransactionTest.java" "$TEST/SystemInspectorTest.java" "$TEST/ActionHistoryTest.java" "$TEST/DeviceOverviewTest.java" "$TEST/AccessStatusTest.java"
          java -cp "$RUNNER_TEMP/legion-tests" dev.legion.control.PolicyTest
          java -cp "$RUNNER_TEMP/legion-tests" dev.legion.control.QuickProfileTest
          java -cp "$RUNNER_TEMP/legion-tests" dev.legion.control.MutationTransactionTest
          java -cp "$RUNNER_TEMP/legion-tests" dev.legion.control.SystemInspectorTest
          java -cp "$RUNNER_TEMP/legion-tests" dev.legion.control.ActionHistoryTest
          java -cp "$RUNNER_TEMP/legion-tests" dev.legion.control.DeviceOverviewTest
          java -cp "$RUNNER_TEMP/legion-tests" dev.legion.control.AccessStatusTest
          grep -F 'android:exported="false"' legion-control-center/app/src/main/AndroidManifest.xml
          grep -F 'Settings.ACTION_APPLICATION_SETTINGS' "$BASE/SettingsNavigator.java"
          grep -F 'Пункт отсутствует — открыть ' "$BASE/AccessCenterActivity.java"
          grep -F 'openSelectedAppInfo(service)' "$BASE/AccessCenterActivity.java"
          grep -F 'AccessStatus.State.RESTRICTED' "$BASE/AccessCenterActivity.java"
          grep -F 'isAccessibilityTargetAllowed' "$BASE/AccessRepository.java"
          grep -F 'DISABLED_UNVERIFIED' "$BASE/AccessStatus.java"
          grep -F 'Settings.ACTION_APPLICATION_DETAILS_SETTINGS' "$BASE/SettingsNavigator.java"
          grep -F 'Uri.fromParts("package",packageName,null)' "$BASE/SettingsNavigator.java"
          grep -F 'Android 17 использует Enhanced Confirmation' "$BASE/AccessCenterActivity.java"
          grep -F "private void showStructuredResults(" "$BASE/MainActivity.java"
          grep -F 'private void checkShizukuConnection()' "$BASE/MainActivity.java"
          grep -F 'Shizuku подключается. Повтори действие' "$BASE/MainActivity.java"
          grep -F 'scroll.fullScroll(View.FOCUS_DOWN)' "$BASE/MainActivity.java"
          grep -F 'Откат станет доступен после первого изменения' "$BASE/MainActivity.java"
          grep -F 'private String lastCheckedLabel()' "$BASE/AccessCenterActivity.java"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble unsigned release
        run: gradle --no-daemon --stacktrace -p legion-control-center :app:assembleRelease

      - name: Align, sign and validate using permanent release key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LEGION_RELEASE_KEYSTORE_BASE64 }}
          LEGION_RELEASE_STORE_PASSWORD: ${{ secrets.LEGION_RELEASE_STORE_PASSWORD }}
          LEGION_RELEASE_KEY_PASSWORD: ${{ secrets.LEGION_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LEGION_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_B64" || { echo 'Missing release keystore secret'; exit 1; }
          test -n "$LEGION_RELEASE_STORE_PASSWORD" || { echo 'Missing release store-password secret'; exit 1; }
          test -n "$LEGION_RELEASE_KEY_PASSWORD" || { echo 'Missing release key-password secret'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing release alias secret'; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$SDK_ROOT/build-tools/35.0.0"
          UNSIGNED='legion-control-center/app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED="$RUNNER_TEMP/legion-control-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/legion-control-release.p12"
          OUTPUT="$GITHUB_WORKSPACE/Legion-Control-v1.8.0-beta5-release.apk"
          test -s "$UNSIGNED"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
            -storepass:env LEGION_RELEASE_STORE_PASSWORD >/dev/null
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:LEGION_RELEASE_STORE_PASSWORD --key-pass env:LEGION_RELEASE_KEY_PASSWORD \
            --out "$OUTPUT" "$ALIGNED"
          "$BT/apksigner" verify --verbose "$OUTPUT"
          CERT_DIGEST="$("$BT/apksigner" verify --print-certs "$OUTPUT" | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"
          EXPECTED='c912747bc79e33adfc327817e36c667719937de59dcad1c22bf154e44bb56f5a'
          test -n "$CERT_DIGEST" && test "$CERT_DIGEST" = "$EXPECTED" || {
            echo 'Release signing certificate mismatch.'; exit 1;
          }
          "$BT/aapt" dump badging "$OUTPUT" | grep -F "package: name='dev.legion.control' versionCode='13' versionName='1.8.0-beta5'"
          sha256sum "$OUTPUT"
          rm -f "$KEYSTORE" "$ALIGNED"

      - name: Upload compatible signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Legion-Control-v1.8.0-beta5-Release-Signed
          path: Legion-Control-v1.8.0-beta5-release.apk
          if-no-files-found: error
          retention-days: 30
