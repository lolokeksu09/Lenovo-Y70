name: Release Legion Control (stable signing)

on:
  workflow_dispatch:
  push:
    tags:
      - 'legion-control-v*'

permissions:
  contents: read

concurrency:
  group: legion-control-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret availability (without disclosure)
        env:
          KEYSTORE_B64: ${{ secrets.LEGION_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LEGION_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LEGION_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LEGION_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing secret: LEGION_RELEASE_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing secret: LEGION_RELEASE_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing secret: LEGION_RELEASE_KEY_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing secret: LEGION_RELEASE_KEY_ALIAS'; exit 1; }

      - name: Restore pinned Android sources
        run: |
          set -euo pipefail
          base64 --decode legion-control-source.b64 > "$RUNNER_TEMP/legion-control-source.tar.xz"
          echo 'c6cee95d751784482d03a8c0fdf35c1c04b7acbe9c7a3887d215abdd9d96d7f5  '"$RUNNER_TEMP"'/legion-control-source.tar.xz' | sha256sum -c
          tar -xJf "$RUNNER_TEMP/legion-control-source.tar.xz"
          grep -F "applicationId 'dev.legion.control'" legion-control-center/app/build.gradle
          grep -F 'versionCode 2' legion-control-center/app/build.gradle
          grep -F "versionName '1.1.0'" legion-control-center/app/build.gradle
          ! grep -q 'applicationIdSuffix' legion-control-center/app/build.gradle
          grep -F 'android:label="Legion Control"' legion-control-center/app/src/main/AndroidManifest.xml
          mkdir -p "$RUNNER_TEMP/legion-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/legion-tests" \
            legion-control-center/app/src/main/java/dev/legion/control/CommandPolicy.java \
            legion-control-center/tests/PolicyTest.java
          java -cp "$RUNNER_TEMP/legion-tests" dev.legion.control.PolicyTest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble unsigned release
        run: gradle --no-daemon --stacktrace -p legion-control-center :app:assembleRelease

      - name: Align and sign with pinned release certificate
        env:
          KEYSTORE_B64: ${{ secrets.LEGION_RELEASE_KEYSTORE_BASE64 }}
          LEGION_RELEASE_STORE_PASSWORD: ${{ secrets.LEGION_RELEASE_STORE_PASSWORD }}
          LEGION_RELEASE_KEY_PASSWORD: ${{ secrets.LEGION_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LEGION_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          UNSIGNED='legion-control-center/app/build/outputs/apk/release/app-release-unsigned.apk'
          ALIGNED="$RUNNER_TEMP/legion-control-release-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/legion-control-release.p12"
          OUTPUT="$GITHUB_WORKSPACE/Legion-Control-v1.1.0-release.apk"
          test -s "$UNSIGNED"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
            -storepass:env LEGION_RELEASE_STORE_PASSWORD >/dev/null
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:LEGION_RELEASE_STORE_PASSWORD \
            --key-pass env:LEGION_RELEASE_KEY_PASSWORD \
            --out "$OUTPUT" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"
          CERT_DIGEST="$("$BUILD_TOOLS/apksigner" verify --print-certs "$OUTPUT" | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"
          EXPECTED='c912747bc79e33adfc327817e36c667719937de59dcad1c22bf154e44bb56f5a'
          test -n "$CERT_DIGEST" && test "$CERT_DIGEST" = "$EXPECTED" || {
            echo 'Release signing certificate does not match the pinned identity.'
            exit 1
          }
          "$BUILD_TOOLS/aapt" dump badging "$OUTPUT" | grep -F "package: name='dev.legion.control' versionCode='2' versionName='1.1.0'"
          sha256sum "$OUTPUT"
          rm -f "$KEYSTORE" "$ALIGNED"

      - name: Upload stable signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Legion-Control-v1.1.0-Release-Signed
          path: Legion-Control-v1.1.0-release.apk
          if-no-files-found: error
          retention-days: 30