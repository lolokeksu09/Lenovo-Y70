name: PDD Overlay RU isolated Android build
on:
  push:
    branches: [pdd-overlay-ru-build-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack standalone overlay project
        run: |
          base64 --decode pdd-overlay-ru/source_bundle.base64 > /tmp/pdd-source.zip
          unzip -q /tmp/pdd-source.zip
      - name: Test source invariants
        run: bash pinduoduo_overlay_ru/scripts/test_local.sh
      - name: Build APK
        run: gradle -p pinduoduo_overlay_ru :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PddOverlayRU-0.1.0-debug-apk
          path: pinduoduo_overlay_ru/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
