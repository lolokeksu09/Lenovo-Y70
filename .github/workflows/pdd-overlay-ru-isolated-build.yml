name: PDD Overlay RU isolated Android build
on:
  push:
    branches: [pdd-overlay-ru-build-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack standalone overlay project
        run: |
          base64 --decode pdd-overlay-ru/source_bundle.base64 > /tmp/pdd-source.zip
          unzip -q /tmp/pdd-source.zip
      - name: Apply mobile network v0.1.1 delta
        run: python3 pdd-overlay-ru/upgrade_mobile_011.py
      - name: Test source invariants
        run: bash pinduoduo_overlay_ru/scripts/test_local.sh
      - name: Build unsigned release APK
        run: gradle -p pinduoduo_overlay_ru :app:assembleRelease --no-daemon --stacktrace
      - name: Export Android signing tool
        shell: bash
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | head -n 1)
          test -n "$SIGNER"
          cp "$SIGNER" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: PddOverlayRU-0.1.1-unsigned-and-signer
          path: |
            pinduoduo_overlay_ru/app/build/outputs/apk/release/app-release-unsigned.apk
            apksigner.jar
          if-no-files-found: error
