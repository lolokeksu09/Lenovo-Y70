name: Build Lenovo Y70 v3.4.0 crash diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: f1rzen-n/LenovoMotorolovichY70
          ref: 10ffc78b9c97326467dc457513d6182581416991
          path: upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate patched source
        run: python tests/check_static.py
      - name: Verify v3.1 safety invariants
        run: python tests/check_v31.py
      - name: Verify disabled filter data flow
        run: python tests/check_disabled_filter.py
      - name: Run disabled filter JVM regression test
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/filter-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/DisabledFilterPolicy.java' 'tests/DisabledFilterPolicyTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.DisabledFilterPolicyTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run live package-state reconciliation regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/package-state-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/PackageStateResolver.java' 'tests/PackageStateResolverTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.PackageStateResolverTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify bulk restore UI and safety invariants
        run: python tests/check_bulk_enable.py
      - name: Run bulk restore JVM selection test
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/bulk-enable-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/BulkEnablePolicy.java' 'tests/BulkEnablePolicyTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.BulkEnablePolicyTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Motorola restricted-enable error regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/bulk-error-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/BulkEnableFailure.java' 'tests/BulkEnableFailureTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.BulkEnableFailureTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Android Settings recovery path
        run: python tests/check_settings_recovery.py
      - name: Run Android enabled-state recovery route test
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/restore-route-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/RestoreRoute.java' 'tests/RestoreRouteTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.RestoreRouteTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify async filter selection data flow
        run: python tests/check_filter_selection.py
      - name: Run filter selection race regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/filter-state-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/DebloatFilterSelection.java' 'tests/DebloatFilterSelectionTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.DebloatFilterSelectionTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit removed experimental features
        run: python tests/check_cleanup_v318.py
      - name: Verify Motorola GameTime diagnostics wiring
        run: python tests/check_game_diagnostics.py
      - name: Run Motorola hardware state parser regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/game-state-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaGameStateParser.java' 'tests/MotorolaGameStateParserTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.MotorolaGameStateParserTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Motorola crash recovery and clipboard logs
        run: python tests/check_game_crash_recovery.py
      - name: Verify MAXE thermal read-only integration
        run: python tests/check_maxe_thermal.py
      - name: Run MAXE thermal parser JVM regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/thermal-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaThermalState.java' 'tests/MotorolaThermalStateTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.MotorolaThermalStateTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Motorola Binder recovery invariants
        run: python tests/check_moto_binder_recovery.py
      - name: Run Motorola Binder failure JVM regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/binder-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaBinderFailurePolicy.java' 'tests/android/os/DeadObjectException.java' 'tests/MotorolaBinderFailurePolicyTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.MotorolaBinderFailurePolicyTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify 90-second capture integration and safety
        run: python tests/check_motorola_capture.py
      - name: Run bounded game capture JVM regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/capture-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaGameStateParser.java' 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaCaptureFormat.java' 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaCaptureReport.java' 'tests/MotorolaCaptureFormatTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.MotorolaCaptureFormatTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Android legacy reflection and crash scope
        run: python tests/check_android_reflection_compat.py
      - name: Run reflection and crash isolation JVM regressions
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/crash-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaReflectionFailurePolicy.java' 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaCrashLogFilter.java' 'tests/MotorolaReflectionFailurePolicyTest.java' 'tests/MotorolaCrashLogFilterTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.MotorolaReflectionFailurePolicyTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.MotorolaCrashLogFilterTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify direct Binder visibility gate
        run: python tests/check_motorola_direct_binder_gate.py
      - name: Run Motorola Touch routing JVM regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/game-route-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaTouchRoute.java' 'tests/MotorolaTouchRouteTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.MotorolaTouchRouteTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify foreground versus running-process diagnosis
        run: python tests/check_motorola_foreground.py
      - name: Run foreground detection JVM regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'tests/foreground-classes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & javac -encoding UTF-8 -d $out 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaGameStateParser.java' 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaCaptureFormat.java' 'overrides/ResolutionMasterApp/src/com/moto/resolutionmaster/MotorolaForegroundState.java' 'tests/MotorolaForegroundStateTest.java'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $out com.moto.resolutionmaster.MotorolaForegroundStateTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Legion AMOLED redesign and preserved control actions
        run: python tests/check_legion_amoled_redesign.py
      - name: Prepare Android SDK standalone build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          $manager = Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $manager) { throw 'sdkmanager not found' }
          & $manager.FullName 'platforms;android-34' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed' }
          $target = Join-Path $PWD 'upstream/build-tools'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $bt = Join-Path $sdk 'build-tools/35.0.0'
          Copy-Item (Join-Path $bt 'aapt2.exe') (Join-Path $target 'aapt2.exe')
          Copy-Item (Join-Path $sdk 'platforms/android-34/android.jar') (Join-Path $target 'android.jar')
          Copy-Item (Join-Path $bt 'lib/d8.jar') (Join-Path $target 'r8.jar')
          Copy-Item (Join-Path $bt 'lib/apksigner.jar') (Join-Path $target 'apksig.jar')
      - name: Overlay corrected sources
        shell: pwsh
        run: Copy-Item 'overrides/ResolutionMasterApp/*' 'upstream/ResolutionMasterApp/' -Recurse -Force
      - name: Build signed debug APK
        working-directory: upstream
        run: python build_apk.py
      - name: Rename APK to current version
        shell: pwsh
        run: Move-Item 'upstream/LenovoMotorolovichY70_v2.9.apk' 'upstream/LenovoMotorolovichY70_v3.4.0-game.apk'
      - name: Check APK format
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('upstream/LenovoMotorolovichY70_v3.4.0-game.apk'); assert {'classes.dex','AndroidManifest.xml'} <= set(z.namelist()); print('APK ZIP: PASS')"
      - uses: actions/upload-artifact@v4
        with:
          name: Lenovo-Y70-v3.4.0-game-debug
          path: upstream/LenovoMotorolovichY70_v3.4.0-game.apk
          if-no-files-found: error
          retention-days: 14
