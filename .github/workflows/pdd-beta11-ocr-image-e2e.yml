name: PDD beta11 real Chinese image OCR E2E
on:
  push:
    branches: [pdd-beta11-ocr-image-e2e, pdd-overlay-ru-compose-single-v020]
    paths:
      - '.github/workflows/pdd-beta11-ocr-image-e2e.yml'
      - 'pdd-overlay-ru/qa/ocr_image_e2e.sh'
      - 'pdd-overlay-ru/qa/pick_photo.py'
      - 'pdd-overlay-ru/qa/fixtures/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Resolve canonical source tree
        run: python3 pdd-overlay-ru/beta11/bootstrap_android.py
      - name: Build emulator-only x86_64 debug package
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/ndk { abiFilters 'arm64-v8a' }/ndk { abiFilters 'x86_64' }/" pdd-overlay-ru/android/app/build.gradle
          gradle -p pdd-overlay-ru/android :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Exercise real Chinese OCR from Android system picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4096M
          disable-animations: true
          script: bash pdd-overlay-ru/qa/ocr_image_e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDD-beta11-Chinese-OCR-image-e2e-evidence
          path: pdd-ocr-image-e2e-evidence/
          if-no-files-found: warn
